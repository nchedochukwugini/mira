name: MIRA Market Intelligence

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Collection run or read-only audit of unavailable markets
        type: choice
        options:
          - collect
          - audit-unavailable
        default: collect
        required: true
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: mira-market-intelligence-production
  cancel-in-progress: false

jobs:
  collect:
    name: Collect verified fills and market snapshots
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Session advisory locks require a dedicated backend. Neon pooled URLs
      # use PgBouncer transaction pooling and cannot safely hold this lock.
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      PANTA_API_KEY: ${{ secrets.PANTA_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      NEXT_PUBLIC_MARKET_PROVIDER: panta
      MARKET_WORKER_MAX_MARKETS: "5"
      TRADE_MAX_SIGNATURES_PER_SCAN: "1000"
      TRADE_MAX_TRANSACTIONS_PER_CYCLE: "10"
      SOLANA_RPC_TIMEOUT_MS: "15000"
      DB_CONNECT_TIMEOUT_MS: "10000"
      DB_QUERY_TIMEOUT_MS: "30000"
      MIRA_WORKER_MODE: "true"
    steps:
      - name: Check required repository secrets
        id: required-secrets
        shell: bash
        run: |
          missing=0
          for name in PANTA_API_KEY SOLANA_RPC_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Actions secret is missing: $name"
              missing=1
            fi
          done
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "Required Actions secret is missing: DATABASE_URL_DIRECT"
            missing=1
          fi
          if [[ "$missing" == "1" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Production collection skipped"
              echo "Add the missing repository Actions secrets listed in the preceding step, then run this workflow again. No worker was started."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
        if: steps.required-secrets.outputs.ready == 'true'
      - name: Verify production credential targets
        id: target-check
        if: steps.required-secrets.outputs.ready == 'true'
        run: |
          node -e 'const u = new URL(process.env.DATABASE_URL); const neon = u.hostname.endsWith(".neon.tech"); const mira = decodeURIComponent(u.pathname.replace(/^\//, "")).toLowerCase() === "mira"; const direct = !u.hostname.includes("-pooler"); if (!neon || !mira || !direct) { console.error("DATABASE_URL_DIRECT must target the direct Neon MIRA endpoint (not PgBouncer)."); process.exit(1); } if (!process.env.PANTA_API_KEY.startsWith("pk_live_")) { console.error("PANTA_API_KEY must be a Panta live key for production collection."); process.exit(1); } console.log("Production target verified: direct Neon database MIRA and Panta live credentials.");'
      - name: Record worker start time
        id: worker-start
        if: steps.required-secrets.outputs.ready == 'true' && steps.target-check.outcome == 'success'
        run: echo "at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Run one bounded trade scan
        if: steps.required-secrets.outputs.ready == 'true'
        run: npm run worker:market-intelligence:once
      - name: Run one bounded snapshot collection
        if: steps.required-secrets.outputs.ready == 'true'
        run: npm run worker:market-snapshots:once
      - name: Verify persisted production data (read only)
        if: always() && steps.required-secrets.outputs.ready == 'true' && steps.target-check.outcome == 'success'
        env:
          MIRA_WORKER_STARTED_AT: ${{ steps.worker-start.outputs.at }}
        run: node scripts/verify-market-worker-data.mjs
      - name: Inspect pending transaction outcomes (read only)
        if: always() && steps.required-secrets.outputs.ready == 'true' && steps.target-check.outcome == 'success'
        env:
          MIRA_WORKER_STARTED_AT: ${{ steps.worker-start.outputs.at }}
        run: node --conditions=react-server --import tsx scripts/inspect-pending-market-transactions.mjs

  audit-unavailable:
    name: Audit recent unavailable markets (read only)
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-unavailable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Verify direct Neon MIRA target
        run: |
          node -e 'const u = new URL(process.env.DATABASE_URL); const neon = u.hostname.endsWith(".neon.tech"); const mira = decodeURIComponent(u.pathname.replace(/^\//, "")).toLowerCase() === "mira"; const direct = !u.hostname.includes("-pooler"); if (!neon || !mira || !direct) { console.error("DATABASE_URL_DIRECT must target the direct Neon MIRA endpoint."); process.exit(1); } console.log("Read-only audit target verified: direct Neon database MIRA.");'
      - name: Inspect recent active-market unavailable alerts
        run: node scripts/inspect-unavailable-market-alerts.mjs
